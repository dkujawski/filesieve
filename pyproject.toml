[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "filesieve"
version = "0.0.0"
description = "Find duplicate files by content and move duplicates to an alternate directory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "build>=1.5,<2",
    "pytest>=9.1.1,<10",
    "ruff>=0.15.22,<0.16",
]

[project.scripts]
filesieve = "filesieve.cmd:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
addopts = "-ra"
markers = [
    "functional: requires optional system tools or external test data",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "W"]
ignore = ["E501"]
